name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Build never actually connects — every DB-querying page is force-dynamic,
      # so neon() only needs a syntactically valid string at build time.
      DATABASE_URL: postgresql://user:pass@example.com/db
      # GitHub's short-lived workflow token installs the private @andershauch
      # packages. Package access is granted directly to this repository.
      NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      # Turbopack's Google-font resolver is unreliable on GitHub-hosted runners.
      # Production keeps its normal Coolify build; CI uses the stable Webpack path.
      - run: npm run build -- --webpack
